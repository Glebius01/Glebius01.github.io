<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  
  <!-- Font Awesome CDN for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="{{ '/_assets/css/style.css' | relative_url }}">
 
</head>
<body>

  <header>
    <div>
      <h1><a href="{{ '/' | relative_url }}">Hlib Shepel</a></h1>
      <p>{{ site.description }}</p>
    </div>
    
    <nav>
      <a href="/">
        <i class="fa-solid fa-house"></i> Home
      </a>
      <a href="https://github.com/Glebius01/Glebius01.github.io/tree/main/Labs" target="_blank" rel="noopener">
        <i class="fa-brands fa-github"></i> GitHub view
      </a>
      <a href="https://www.linkedin.com/in/gleb-shep/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin"></i> LinkedIn
      </a>
      <a href="mailto:glebshepel1@gmail.com" aria-label="Gmail">
        <i class="fa-solid fa-envelope"></i> Gmail
      </a>
    </nav>
      
    <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">🌓 Toggle Mode</button>
  </header>

  <main>
    {{ content }}
  </main>

  <script>
    // Theme toggle memory logic
    function toggleTheme() {
      const body = document.body;
      if (body.classList.contains('dark-theme')) {
        body.classList.remove('dark-theme');
        body.classList.add('light-theme');
        localStorage.setItem('theme', 'light');
      } else {
        body.classList.remove('light-theme');
        body.classList.add('dark-theme');
        localStorage.setItem('theme', 'dark');
      }
    }

    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.body.classList.add(savedTheme + '-theme');
      }
    })();
  </script>
</body>
</html>
