### File 1: `_config.yml`
Replace everything in your `_config.yml` with this exact code:

```yaml
title: "Hlib | Cyber Security Portfolio"
description: "Security labs, investigations, and technical write-ups"
markdown: kramdown

collections:
  labs:
    output: true
    permalink: /labs/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
