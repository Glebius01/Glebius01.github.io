<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body {
      background-color: #11111b;
      color: #cdd6f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    a { color: #89b4fa; text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      border-bottom: 1px solid #313244;
      padding-bottom: 15px;
      margin-bottom: 30px;
    }

    /* Grid Layout */
    .writeup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    /* Interactive Card */
    .writeup-card {
      display: flex;
      flex-direction: column;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 18px;
      text-decoration: none !important;
      color: #cdd6f4;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .writeup-card:hover {
      transform: translateY(-4px);
      border-color: #89b4fa;
    }

    .writeup-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .writeup-title {
      margin: 0;
      font-size: 1.1rem;
      color: #f38ba8;
    }

    .writeup-desc {
      font-size: 0.875rem;
      color: #a6adc8;
      margin: 0 0 15px 0;
      flex-grow: 1;
    }

    /* Badges */
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .platform-hack-the-box { background: #1a2332; color: #9fef00; border: 1px solid #9fef00; }
    .platform-tryhackme { background: #212c42; color: #ff2b2b; border: 1px solid #ff2b2b; }
    .platform-sherlocks { background: #11111b; color: #89b4fa; border: 1px solid #89b4fa; }

    .diff-easy { color: #a6e3a1; border: 1px solid #a6e3a1; }
    .diff-medium { color: #f9e2af; border: 1px solid #f9e2af; }
    .diff-hard { color: #f38ba8; border: 1px solid #f38ba8; }

    .writeup-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .writeup-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .skill-tag {
      background: #313244;
      color: #bac2de;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p>{{ site.description }}</p>
  </header>

  <main>
    {{ content }}
  </main>

</body>
</html>
