<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  
  <!-- Font Awesome CDN for LinkedIn, GitHub, and Gmail Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* 1. COLOR VARIABLES & THEMES */
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #38bdf8;
      --tag-bg: #334155;
      --tag-text: #cbd5e1;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #f8fafc;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --accent: #0284c7;
        --tag-bg: #e2e8f0;
        --tag-text: #334155;
      }
    }

    /* Manual Override Theme Classes */
    body.dark-theme {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #38bdf8;
      --tag-bg: #334155;
      --tag-text: #cbd5e1;
    }

   body.light-theme {
      --bg-primary: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #334155;
      --border-color: #cbd5e1;
      --accent: #0284c7;
      --tag-bg: #e2e8f0;
      --tag-text: #0f172a;
    }

    /* 2. BASE STYLES */
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    header h1 { margin: 0; font-size: 1.75rem; }
    header h1 a { color: var(--text-main); text-decoration: none; }
    header p { margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.95rem; }

    /* NAVIGATION & ICON STYLES */
    nav {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    nav a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    nav i, nav svg {
      max-width: none !important;
      width: auto !important;
      height: auto !important;
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }
    .theme-toggle-btn:hover { background: var(--bg-card-hover); }

    /* 3. CARD GRID SYSTEM */
    .writeup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .writeup-card {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      text-decoration: none !important;
      color: var(--text-main);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .writeup-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .writeup-card.hidden { display: none !important; }

    .writeup-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .writeup-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .writeup-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0 0 16px 0;
      flex-grow: 1;
    }
    
    /* Fix Writeup Content Readability */
    main img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 1.5rem 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    main h1, main h2, main h3, main h4 {
      color: var(--accent); /* Matches your theme color */
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      /* text-transform: uppercase; REMOVED to de-capitalize */
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Changed HTB to dark green */
    .platform-hack-the-box { background: #1a2332; color: #16a34a; border: 1px solid #16a34a; }

    .writeup-footer {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start; /* THIS FIXES THE STRETCHED DIFFICULTY BOX */
    }
    .writeup-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .skill-tag {
      background-color: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
    }

    /* 5. INTERACTIVE FILTER BUTTONS */
    .filter-container {
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1><a href="{{ '/' | relative_url }}">Hlib Shepel</a></h1>
      <p>{{ site.description }}</p>
    </div>
    
    <nav>
      <a href="/">Home</a>
      <a href="https://github.com/Glebius01/Glebius01.github.io/tree/main/Labs" target="_blank" rel="noopener">
        <i class="fa-brands fa-github"></i> GitHub view
      </a>
      <a href="https://www.linkedin.com/in/gleb-shep/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin"></i> LinkedIn
      </a>
      <a href="mailto:glebshepel1@gmail.com" aria-label="Gmail">
        <i class="fa-solid fa-envelope"></i> Gmail
      </a>
    </nav>
      
    <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">🌓 Toggle Mode</button>
  </header>

  <main>
    {{ content }}
  </main>

  <script>
    // Theme toggle memory logic
    function toggleTheme() {
      const body = document.body;
      if (body.classList.contains('dark-theme')) {
        body.classList.remove('dark-theme');
        body.classList.add('light-theme');
        localStorage.setItem('theme', 'light');
      } else {
        body.classList.remove('light-theme');
        body.classList.add('dark-theme');
        localStorage.setItem('theme', 'dark');
      }
    }

    // Restore user theme preference if set manually
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.body.classList.add(savedTheme + '-theme');
      }
    })();
  </script>
</body>
</html>
