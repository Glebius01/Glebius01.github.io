<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b0f14;
      color: #e6e6e6;
      margin: 0;
      line-height: 1.6;
    }

    header {
      padding: 2rem;
      border-bottom: 1px solid #222;
    }

    nav a {
      margin-right: 1rem;
      color: #7cc7ff;
      text-decoration: none;
    }

    a { color: #7cc7ff; }

    /* MAIN LAYOUT */
    .container {
      display: flex;
      max-width: 1200px;
      margin: auto;
    }

    main {
      flex: 1;
      max-width: 900px;
      padding: 2rem;
    }

    /* SIDEBAR */
    #toc {
      width: 250px;
      position: sticky;
      top: 20px;
      align-self: flex-start;
      padding: 2rem 1rem;
      border-left: 1px solid #222;
      font-size: 0.9rem;
    }

    #toc a {
      display: block;
      margin: 6px 0;
      color: #7cc7ff;
      text-decoration: none;
      opacity: 0.85;
    }

    #toc a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* HEADINGS spacing */
    h2, h3 {
      scroll-margin-top: 80px;
    }

    /* BACK TO TOP BUTTON */
    #topBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      text-decoration: none;
      border: 1px solid #333;
      display: none;
      opacity: 0.85;
      z-index: 999;
    }

    #topBtn:hover {
      opacity: 1;
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }

      #toc {
        width: auto;
        border-left: none;
        border-top: 1px solid #222;
      }
    }

    /* IMAGE CONTROL */
    img {
      max-width: 800px;
      width: 100%;
      max-height: 600px;
      height: auto;
      display: block;
      margin: 1rem auto;
      border-radius: 6px;
      border: 1px solid #333;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <header>
    <h1>{{ site.title }}</h1>
    <nav>
      <a href="/">Home</a>
      <a href="https://github.com/Glebius01/Glebius01.github.io/tree/main/Labs">GitHub view</a>
    </nav>
  </header>

  <div class="container">

    <!-- MAIN CONTENT -->
    <main>
      {{ content }}
    </main>

    <!-- TABLE OF CONTENTS -->
    <aside id="toc">
      <strong>Contents</strong>
      <div id="toc-list"></div>
    </aside>

  </div>

  <!-- BACK TO TOP -->
  <a href="#" id="topBtn">↑ Top</a>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      /* BACK TO TOP */
      const btn = document.getElementById("topBtn");

      window.addEventListener("scroll", function () {
        btn.style.display = window.scrollY > 300 ? "block" : "none";
      });

      /* TABLE OF CONTENTS */
      const tocList = document.getElementById("toc-list");
      const headings = document.querySelectorAll("main h2, main h3");

      headings.forEach((heading, index) => {
        if (!heading.id) {
          heading.id = "h-" + index;
        }

        const link = document.createElement("a");
        link.href = "#" + heading.id;
        link.textContent = heading.textContent;

        if (heading.tagName === "H3") {
          link.style.marginLeft = "15px";
          link.style.fontSize = "0.85rem";
          link.style.opacity = "0.8";
        }

        tocList.appendChild(link);
      });

    });
  </script>

</body>
</html>
