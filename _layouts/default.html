<div class="writeup-grid">
  {% for writeup in site.data.writeups %}
    <a href="{{ writeup.url | relative_url }}" class="writeup-card">
      <div class="writeup-card-content">
        
        <div class="writeup-header">
          <h3 class="writeup-title">{{ writeup.title }}</h3>
          {% if writeup.platform %}
            <span class="badge platform-{{ writeup.platform | downcase | replace: ' ', '-' }}">
              {{ writeup.platform }}
            </span>
          {% endif %}
        </div>

        <p class="writeup-desc">{{ writeup.description }}</p>

        <div class="writeup-footer">
          {% if writeup.difficulty %}
            <span class="badge diff-{{ writeup.difficulty | downcase }}">
              {{ writeup.difficulty }}
            </span>
          {% endif %}
          
          <div class="writeup-skills">
            {% for skill in writeup.skills %}
              <span class="skill-tag">{{ skill }}</span>
            {% endfor %}
          </div>
        </div>
        
      </div>
    </a>
  {% endfor %}
</div>
