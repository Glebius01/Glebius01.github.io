<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  
  <!-- Font Awesome CDN for LinkedIn, GitHub, and Gmail Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

</head>
<body>

  <header>
    <div>
      <h1><a href="{{ '/' | relative_url }}">Hlib Shepel</a></h1>
      <p>{{ site.description }}</p>
    </div>
    
   <nav>
      <a href="/">
        <i class="fa-solid fa-house"></i> Home
      </a>
      <a href="https://github.com/Glebius01/Glebius01.github.io/tree/main/Labs" target="_blank" rel="noopener">
        <i class="fa-brands fa-github"></i> GitHub view
      </a>
      <a href="https://www.linkedin.com/in/gleb-shep/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin"></i> LinkedIn
      </a>
      <a href="mailto:glebshepel1@gmail.com" aria-label="Gmail">
        <i class="fa-solid fa-envelope"></i> Gmail
      </a>
    </nav>
      
    <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">🌓 Toggle Mode</button>
  </header>

<!-- Page Wrapper for Two-Column Layout -->
  <div class="page-wrapper {% if page.url contains '/Labs/' %}is-writeup{% endif %}">
    
    {% if page.url contains '/Labs/' %}
    <aside id="toc-sidebar">
      <div class="toc-sticky">
        <h3>Table of Contents</h3>
        <nav id="toc-list">
          <!-- JS will automatically inject links here -->
        </nav>
      </div>
    </aside>
    {% endif %}

    <main>
      {{ content }}
    </main>
  </div>

  <script>
    // Theme toggle memory logic
    function toggleTheme() {
      const body = document.body;
      if (body.classList.contains('dark-theme')) {
        body.classList.remove('dark-theme');
        body.classList.add('light-theme');
        localStorage.setItem('theme', 'light');
      } else {
        body.classList.remove('light-theme');
        body.classList.add('dark-theme');
        localStorage.setItem('theme', 'dark');
      }
    }

    // Restore user theme preference if set manually
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.body.classList.add(savedTheme + '-theme');
      }
    })();
  </script>
  
<script>
    // Automatic Table of Contents Generator
    document.addEventListener("DOMContentLoaded", function() {
      const tocList = document.getElementById('toc-list');
      if (!tocList) return; // Only runs if the TOC sidebar exists

      const headings = document.querySelectorAll('main h1, main h2, main h3');
      if (headings.length === 0) {
        document.getElementById('toc-sidebar').style.display = 'none';
        return;
      }

      headings.forEach((heading) => {
        // Create an ID for the heading if it doesn't have one
        if (!heading.id) {
          heading.id = heading.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }

        const link = document.createElement('a');
        link.href = '#' + heading.id;
        link.textContent = heading.textContent;
        
        // Indent based on header level
        if (heading.tagName === 'H2') link.style.marginLeft = '12px';
        if (heading.tagName === 'H3') link.style.marginLeft = '24px';

        tocList.appendChild(link);
      });
    });
  </script>
</body>
</html>
