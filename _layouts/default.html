<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  
  <!-- Font Awesome CDN for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
 
</head>
<body>

  <!-- Theme: runs first so the page never flashes the wrong colours -->
  <script>
    function applyTheme(theme) {
      document.body.classList.remove('dark-theme', 'light-theme');
      document.body.classList.add(theme + '-theme');
    }

    function toggleTheme() {
      var next = document.body.classList.contains('light-theme') ? 'dark' : 'light';
      applyTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    }

    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(saved || (prefersLight ? 'light' : 'dark'));
    })();
  </script>

  <header>
    <div>
      <h1><a href="{{ '/' | relative_url }}">Hlib Shepel</a></h1>
      <p>{{ site.description }}</p>
    </div>
    
    <nav>
      <a href="/">
        <i class="fa-solid fa-house"></i> Home
      </a>
      <a href="https://github.com/Glebius01/Glebius01.github.io/tree/main/Labs" target="_blank" rel="noopener">
        <i class="fa-brands fa-github"></i> GitHub view
      </a>
      <a href="https://www.linkedin.com/in/gleb-shep/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin"></i> LinkedIn
      </a>
      <a href="mailto:glebshepel1@gmail.com" aria-label="Gmail">
        <i class="fa-solid fa-envelope"></i> Gmail
      </a>
    </nav>
      
    <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">🌓 Toggle Mode</button>
  </header>

  <main>
    {{ content }}
  </main>

  {% unless page.url == '/' %}
  <!-- Back to the writeups list (not shown on the home page) -->
  <a class="back-home" href="{{ '/' | relative_url }}" aria-label="Back to all writeups">
    <i class="fa-solid fa-arrow-left"></i><span>All writeups</span>
  </a>
  {% endunless %}

  <!-- Writeup pages: centred column, optional TOC, screenshot lightbox -->
  <script>
    (function () {
      var MAX_LEVEL = 3;        // TOC includes h1–h3 (use 4 to add h4)
      var MIN_HEADINGS = 3;     // fewer headings than this = no TOC, text stays centred
      var OFFSET = 120;         // px from top of viewport that counts as "current section"

      var main = document.querySelector('main');
      if (!main || main.querySelector('.writeup-grid')) return;   // skip the home page

      /* ---------- collect headings (before we move any nodes) ---------- */
      var heads = Array.prototype.filter.call(main.querySelectorAll('h1, h2, h3, h4'), function (h) {
        return Number(h.tagName[1]) <= MAX_LEVEL && h.textContent.trim();
      });
      var h1s = heads.filter(function (h) { return h.tagName === 'H1'; });
      if (h1s.length === 1 && heads[0] === h1s[0]) heads.shift();   // lone h1 = page title

      /* ---------- wrap the article in a centred reading column ---------- */
      var body = document.createElement('div');
      body.className = 'writeup-body';
      while (main.firstChild) body.appendChild(main.firstChild);
      main.classList.add('is-writeup');
      main.appendChild(body);

      if (heads.length >= MIN_HEADINGS) buildToc();
      initLightbox();

      /* ============================ TOC ============================ */
      function buildToc() {
        var used = {};
        heads.forEach(function (h) {
          if (!h.id) {
            var base = h.textContent.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-') || 'section';
            var id = base, n = 2;
            while (document.getElementById(id) || used[id]) id = base + '-' + n++;
            h.id = id;
          }
          used[h.id] = true;
        });

        var levels = heads.map(function (h) { return Number(h.tagName[1]); });
        var minLevel = Math.min.apply(null, levels);

        var aside = document.createElement('aside');
        aside.className = 'toc';
        aside.setAttribute('aria-label', 'Table of contents');
        var details = document.createElement('details');
        var summary = document.createElement('summary');
        summary.textContent = 'CONTENTS';
        var list = document.createElement('ol');
        var links = {};

        heads.forEach(function (h, i) {
          var li = document.createElement('li');
          li.className = 'toc-l' + Math.min(levels[i] - minLevel, 2);
          var a = document.createElement('a');
          a.href = '#' + h.id;
          a.textContent = h.textContent.trim();
          li.appendChild(a);
          list.appendChild(li);
          links[h.id] = a;
        });

        details.appendChild(summary);
        details.appendChild(list);
        aside.appendChild(details);
        main.classList.add('has-toc');
        main.insertBefore(aside, body);

        var wide = window.matchMedia('(min-width: 961px)');
        function syncOpen() { details.open = wide.matches; }
        syncOpen();
        if (wide.addEventListener) wide.addEventListener('change', syncOpen);

        var currentId = null;
        function setActive(id) {
          if (id === currentId) return;
          if (currentId) {
            links[currentId].classList.remove('active');
            links[currentId].removeAttribute('aria-current');
          }
          currentId = id;
          var a = links[id];
          a.classList.add('active');
          a.setAttribute('aria-current', 'true');
          if (aside.scrollHeight > aside.clientHeight) {
            var top = a.offsetTop, bottom = top + a.offsetHeight;
            if (top < aside.scrollTop + 24 || bottom > aside.scrollTop + aside.clientHeight - 24) {
              aside.scrollTo({ top: top - aside.clientHeight / 2, behavior: 'smooth' });
            }
          }
        }

        function update() {
          var current = heads[0];
          heads.forEach(function (h) {
            if (h.getBoundingClientRect().top <= OFFSET) current = h;
          });
          if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
            current = heads[heads.length - 1];
          }
          setActive(current.id);
        }

        var ticking = false;
        function onScroll() {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(function () { update(); ticking = false; });
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        update();

        list.addEventListener('click', function (e) {
          if (e.target.closest('a') && !wide.matches) details.open = false;
        });
      }

      /* ========================= LIGHTBOX ========================= */
      function initLightbox() {
        // screenshots inside links keep their link behaviour; add class "no-zoom" to opt out
        var imgs = Array.prototype.filter.call(body.querySelectorAll('img'), function (img) {
          return !img.closest('a') && !img.classList.contains('no-zoom');
        });
        if (!imgs.length) return;

        var overlay = document.createElement('div');
        overlay.className = 'lightbox' + (imgs.length === 1 ? ' single' : '');
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');
        overlay.setAttribute('aria-label', 'Image viewer');
        overlay.innerHTML =
          '<button type="button" class="lb-btn lb-close" aria-label="Close">&times;</button>' +
          '<button type="button" class="lb-btn lb-prev" aria-label="Previous image">&#8249;</button>' +
          '<button type="button" class="lb-btn lb-next" aria-label="Next image">&#8250;</button>' +
          '<figure><img alt=""><figcaption></figcaption></figure>';
        document.body.appendChild(overlay);

        var full = overlay.querySelector('img');
        var caption = overlay.querySelector('figcaption');
        var closeBtn = overlay.querySelector('.lb-close');
        var index = 0, lastFocus = null;

        function show(i) {
          index = (i + imgs.length) % imgs.length;
          var src = imgs[index];
          full.src = src.currentSrc || src.src;
          full.alt = src.alt || '';
          caption.textContent = (src.alt ? src.alt + '  ' : '') + '(' + (index + 1) + '/' + imgs.length + ')';
        }
        function open(i) {
          lastFocus = document.activeElement;
          show(i);
          overlay.classList.add('open');
          document.body.classList.add('lb-open');
          closeBtn.focus();
        }
        function close() {
          overlay.classList.remove('open');
          document.body.classList.remove('lb-open');
          full.removeAttribute('src');
          if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        imgs.forEach(function (img, i) {
          img.classList.add('zoomable');
          img.setAttribute('tabindex', '0');
          img.setAttribute('role', 'button');
          img.setAttribute('aria-label', 'Expand image' + (img.alt ? ': ' + img.alt : ''));
          img.addEventListener('click', function () { open(i); });
          img.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); }
          });
        });

        overlay.addEventListener('click', function (e) {
          if (e.target.closest('.lb-prev')) { show(index - 1); return; }
          if (e.target.closest('.lb-next')) { show(index + 1); return; }
          close();   // close button, backdrop or the image itself
        });

        document.addEventListener('keydown', function (e) {
          if (!overlay.classList.contains('open')) return;
          if (e.key === 'Escape') close();
          else if (e.key === 'ArrowLeft' && imgs.length > 1) show(index - 1);
          else if (e.key === 'ArrowRight' && imgs.length > 1) show(index + 1);
          else if (e.key === 'Tab') {                     // keep focus inside the viewer
            var btns = Array.prototype.filter.call(overlay.querySelectorAll('button'), function (b) {
              return b.offsetParent !== null;
            });
            var first = btns[0], last = btns[btns.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
        });
      }
    })();
  </script>
</body>
</html>
