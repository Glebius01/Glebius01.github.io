<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b0f14;
      color: #e6e6e6;
      margin: 0;
      line-height: 1.6;
    }

    /* =========================
       HEADER (RESTORED SIMPLE VERSION)
       ========================= */
    header {
      padding: 2rem;
      border-bottom: 1px solid #222;
    }

    nav a {
      margin-right: 1rem;
      color: #7cc7ff;
      text-decoration: none;
      font-size: 1rem;
    }

    a {
      color: #7cc7ff;
      text-decoration: none;
    }

    /* =========================
       LAYOUT (SIMPLE + STABLE)
       ========================= */
    .container {
      display: flex;
      max-width: 1200px;
      margin: auto;
    }

    main {
      flex: 1;
      max-width: 900px;
      padding: 2rem;
    }

    /* WRAP CONTENT ONLY */
    .post-content {
      width: 100%;
    }

    /* =========================
       WRITEUP IMAGES ONLY
       ========================= */
    .post-content img {
      max-width: 800px;
      width: 100%;
      height: auto;
      display: block;
      margin: 1rem auto;
      border-radius: 6px;
      border: 1px solid #333;
    }

    /* =========================
       TOC (MINIMAL + STABLE)
       ========================= */
    #toc {
      width: 260px;
      position: sticky;
      top: 20px;
      align-self: flex-start;
      border-left: 1px solid #222;
      padding: 1rem;
    }

    #toc-list {
      max-height: 70vh;
      overflow-y: auto;
      margin-top: 10px;
      padding-right: 6px;
    }

    #toc a {
      display: block;
      margin: 6px 0;
      font-size: 0.9rem;
      opacity: 0.85;
    }

    #toc a:hover {
      opacity: 1;
    }

    /* collapse */
    #toc.collapsed #toc-list {
      display: none;
    }

    #toc-toggle {
      cursor: pointer;
      font-size: 0.85rem;
      opacity: 0.85;
      user-select: none;
    }

    #toc.collapsed {
      width: 60px;
      overflow: hidden;
    }

    /* =========================
       HEADINGS
       ========================= */
    h1, h2, h3 {
      scroll-margin-top: 80px;
    }

    /* =========================
       TOP BUTTON
       ========================= */
    #topBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      display: none;
      z-index: 999;
    }

    /* =========================
       MOBILE (UNCHANGED BEHAVIOR)
       ========================= */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }

      #toc {
        width: auto;
        border-left: none;
        border-top: 1px solid #222;
      }

      #toc.collapsed {
        width: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>{{ site.title }}</h1>

  <nav>
    <a href="/">Home</a>
    <a href="https://github.com/Glebius01/Glebius01.github.io/tree/main/Labs">
      GitHub view
    </a>

    <!-- ICONS UNTOUCHED -->
    <!--
    <a href="#"><i class="fa-brands fa-linkedin"></i></a>
    <a href="mailto:test@email.com"><i class="fa-solid fa-envelope"></i></a>
    -->
  </nav>
</header>

<div class="container">

  <main>
    <div class="post-content">
      {{ content }}
    </div>
  </main>

  <aside id="toc">
    <div id="toc-toggle">☰ Contents</div>
    <div id="toc-list"></div>
  </aside>

</div>

<a href="#" id="topBtn">↑ Top</a>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const btn = document.getElementById("topBtn");

  window.addEventListener("scroll", function () {
    btn.style.display = window.scrollY > 300 ? "block" : "none";
  });

  const toc = document.getElementById("toc-list");
  const headings = document.querySelectorAll(".post-content h1, .post-content h2, .post-content h3");

  headings.forEach((h) => {
    if (!h.id) {
      h.id = h.textContent.toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "");
    }

    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.textContent;

    if (h.tagName === "H3") {
      a.style.marginLeft = "15px";
      a.style.fontSize = "0.85rem";
      a.style.opacity = "0.8";
    }

    toc.appendChild(a);
  });

  document.getElementById("toc-toggle")
    .addEventListener("click", () => {
      document.getElementById("toc").classList.toggle("collapsed");
    });

});
</script>

</body>
</html>
